[project]
name = "marketplace"
version = "0.1.0"
description = ""
authors = [
    {name = "golldir",email = "golldirmax123@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standart] (>=0.115.12,<0.116.0)",
    "pydantic-settings (>=2.9.1,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "uvicorn (>=0.34.2,<0.35.0)",
    "sqlalchemy (>=2.0.40,<3.0.0)",
    "dynaconf (>=3.2.10,<4.0.0)",
    "alembic (>=1.15.2,<2.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "aioboto3 (>=14.1.0,<15.0.0)",
    "python-jose (>=3.4.0,<4.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "redis (>=6.0.0,<7.0.0)",
    "aio-pika (>=9.5.5,<10.0.0)",
    "pydantic[email] (>=2.11.4,<3.0.0)",
    "taskiq[reload] (>=0.11.17,<0.12.0)",
    "taskiq-aio-pika (>=0.4.2,<0.5.0)",
    "taskiq-fastapi (>=0.3.5,<0.4.0)",
    "aiosmtplib (>=4.0.1,<5.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest (>=8.3.5,<9.0.0)",
    "pytest-asyncio (>=0.26.0,<0.27.0)",
    "trio (>=0.30.0,<0.31.0)",
    "sqlmodel (>=0.0.24,<0.0.25)",
    "requests (>=2.32.3,<3.0.0)",
    "pytest-docker (>=3.2.1,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
